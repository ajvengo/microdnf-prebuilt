name: ASan probe

on:
  workflow_dispatch:
  push:
    branches: [probe/asan-dnf-lock]

concurrency:
  group: asan-${{ github.ref_name }}
  cancel-in-progress: true

env:
  BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT || 'manuelfrancisconaranjo.buildbuddy.io' }}

jobs:
  asan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@9f0750536d239de15c1f8528e2ba6c17a99fb752 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: false
          repository-cache: false
          output-base: ""

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      - name: dnf_lock e2e under ASan + LSan
        run: >-
          bazel test --config=ci --config=asan
          //e2e:lock_direct_test //e2e:lock_layers_test //e2e:test_tools_test

      - name: Confirm the binary is really instrumented
        run: |
          bazel build --config=ci --config=asan --remote_download_outputs=toplevel //:dnf_lock
          bin=bazel-bin/dnf/dnf_lock_linux_amd64/dnf_lock
          ls -l "$bin"
          nm "$bin" 2>/dev/null | grep -c __asan_ || true
          nm "$bin" 2>/dev/null | grep -c __lsan_ || true
          ASAN_OPTIONS=verbosity=1:detect_leaks=1 "$bin" --help 2>&1 | head -30
