name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Pull Docker sandbox image
        run: docker pull gcr.io/flame-public/rbe-ubuntu24-04:latest

      - name: Build all targets
        run: bazel build //... //:microdnf_all //:rpm2archive_all //:lock_all --config=ci

      - name: Test
        run: bazel test //... --config=ci || true
