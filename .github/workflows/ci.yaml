name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  BUILDBUDDY_ENDPOINT: ${{ vars.BUILDBUDDY_ENDPOINT || 'manuelfrancisconaranjo.buildbuddy.io' }}

jobs:
  # Analysis, not execution, dominates: every platform drags in its own toolchain and
  # sysroot graph. Cross targets are `manual`, so `//...` is the host graph only and
  # each platform is analysed in its own parallel job.
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            command: test //...
          - name: linux_amd64
            command: build //:microdnf_linux_amd64 //:rpm2archive_linux_amd64 //:dnf_lock_linux_amd64 //:rpm2files_linux_amd64
          - name: linux_arm64
            command: build //:microdnf_linux_arm64 //:rpm2archive_linux_arm64 //:dnf_lock_linux_arm64 //:rpm2files_linux_arm64
          - name: osx_amd64
            command: build //:microdnf_osx_amd64 //:rpm2archive_osx_amd64 //:dnf_lock_osx_amd64 //:rpm2files_osx_amd64
          - name: osx_arm64
            command: build //:microdnf_osx_arm64 //:rpm2archive_osx_arm64 //:dnf_lock_osx_arm64 //:rpm2files_osx_arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # PRs restore the Bazel binary main saved; only main writes the cache
          cache-save: ${{ github.event_name != 'pull_request' }}
          disk-cache: false
          repository-cache: false

      - name: Configure BuildBuddy Remote Cluster
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: .github/workflows/setup_buildbuddy.sh

      # `bazel test` also builds the non-test targets of `//...`.
      - name: Bazel ${{ matrix.name }}
        run: bazel ${{ matrix.command }} --config=ci
